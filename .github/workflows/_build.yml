name: Build

on:
  workflow_call:


permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Go
        uses: LumeWeb/workflows/.github/actions/setup-go@develop

      - name: Setup JS
        uses: LumeWeb/workflows/.github/actions/setup-js@develop

      - run: npm ci
      - name: Build
        run: |
          make